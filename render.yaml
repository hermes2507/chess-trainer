# Render Blueprint: a static site built from this repo.
services:
  - type: web
    runtime: static
    name: chess-trainer
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Cache-Control
        value: no-cache
